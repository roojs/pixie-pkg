name: X - Debian .deb build (Release calls this)

# The real dpkg-buildpackage job. Start Release - Debian, not this file.
#
# One Architecture: all package. The scripts are the same on every suite.
# The repos ingest includes this file in each apt suite.

on:
  workflow_call:

jobs:
  build-debian:
    name: Debian package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pixie-pkg

      - name: Install build dependencies
        working-directory: pixie-pkg
        run: |
          apt-get install -y --no-install-recommends \
            build-essential meson ninja-build debhelper

      - name: Build Debian package
        working-directory: pixie-pkg
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail
          chmod +x scripts/release/prepare-debian.sh debian/rules
          ./scripts/release/prepare-debian.sh
          dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        working-directory: pixie-pkg
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          found=0
          for deb in ../*.deb; do
            base="$(basename "${deb}")"
            case "${base}" in
              *dbgsym*) continue ;;
              *_all.deb) ;;
              *)
                echo "expected an Architecture: all package: ${base}" >&2
                exit 1
                ;;
            esac
            case "${base}" in
              *+*)
                echo "suite label does not belong on the shared package: ${base}" >&2
                exit 1
                ;;
            esac
            cp -v "${deb}" artifacts/
            found=1
          done
          if [[ "$found" -eq 0 ]]; then
            echo "no .deb files" >&2
            exit 1
          fi
          ls -lh artifacts

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixie-debian
          path: pixie-pkg/artifacts/*
