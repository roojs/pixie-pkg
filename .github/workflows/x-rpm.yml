name: X - RPM build (Release calls this)

# The real rpmbuild job. Start Release - Fedora, not this file.
# One noarch RPM, built on Fedora 44. scripts/ci/build-rpm.sh clears
# the dist tag so Fedora and openSUSE share the file.

on:
  workflow_call:

jobs:
  build-rpm:
    name: RPM
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: |
          set -euo pipefail
          dnf -y install --setopt=install_weak_deps=False git-core ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        run: |
          set -euo pipefail
          chmod +x scripts/ci/build-rpm.sh scripts/release/version.sh
          ./scripts/ci/build-rpm.sh

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixie-rpm
          path: artifacts/*.rpm
